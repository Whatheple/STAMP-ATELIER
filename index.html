<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stamp Atelier</title>
<style>
:root{
  color-scheme:dark;
  --bg:#171717;--panel:#222;--panel2:#292929;--line:#3b3b3b;
  --text:#eee;--muted:#aaa;--accent:#d8c28f;
  --hdr:#1d1d1d;--btn:#303030;--btn-line:#494949;--btn-hover:#393939;--on-accent:#161616;
  --h3:#b8b8b8;--label:#ddd;--chk:#ccc;--input:#171717;--input-line:#444;
  --drop-bg:#1b1b1b;--drop-line:#555;--drop-text:#aaa;--drop-hover:#ddd;
  --dot:#333;--hint:#999;--badge-text:#bbb;--badge-line:#3d3d3d;--shadow:#0009;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e6e6e6;--panel:#f4f4f4;--panel2:#fff;--line:#d0d0d0;
  --text:#222;--muted:#666;--accent:#a8842f;
  --hdr:#fafafa;--btn:#ececec;--btn-line:#c4c4c4;--btn-hover:#e0e0e0;--on-accent:#fff;
  --h3:#666;--label:#333;--chk:#444;--input:#fff;--input-line:#c4c4c4;
  --drop-bg:#fafafa;--drop-line:#bbb;--drop-text:#666;--drop-hover:#222;
  --dot:#c8c8c8;--hint:#777;--badge-text:#555;--badge-line:#ccc;--shadow:#0003;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  height:100vh;overflow:hidden;
}
header{
  height:56px;border-bottom:1px solid var(--line);background:var(--hdr);
  display:flex;align-items:center;padding:0 16px;gap:12px;
}
.logo{font-weight:800;letter-spacing:.08em}.muted{color:var(--muted);font-size:12px}
.spacer{flex:1}
button{
  color:inherit;background:var(--btn);border:1px solid var(--btn-line);border-radius:7px;
  padding:8px 11px;cursor:pointer
}
button:hover{background:var(--btn-hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
main{height:calc(100vh - 56px);display:grid;grid-template-columns:clamp(520px,48vw,640px) 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
.col+.col{border-left:1px solid var(--line)}
.section{padding:7px 14px;border-bottom:1px solid var(--line)}
.section h3{
  margin:0 0 3px;color:var(--h3);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase
}
.section.collapsible h3{
  cursor:pointer;
  user-select:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:0;
}
.section.collapsible h3::after{
  content:"⌄";
  font-size:13px;
  line-height:1;
  color:var(--muted);
  transition:transform .12s ease;
}
.section.collapsible.collapsed h3::after{transform:rotate(-90deg)}
.section.collapsible.collapsed > :not(h3){display:none}
.section.collapsible:not(.collapsed) h3{margin-bottom:3px}
.field{margin:3px 0;display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center}
.field>label{line-height:1.2;display:flex;justify-content:space-between;align-items:center;margin:0;color:var(--label);white-space:nowrap}
.field>label span{color:var(--accent);font-size:12px}
.field>label.chk{justify-content:flex-start;gap:6px;color:var(--chk)}
.field>input[type=text]{grid-column:1/-1}
.pair{display:flex;gap:8px}
.pair>select,.pair>input[type=range]{flex:1;min-width:0}
.pair>input[type=color]{flex:none}
.sizebox{display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.sizebox input{width:76px}
.btns{display:flex;gap:6px;margin-top:8px}
.btns button{flex:1;padding:7px 4px;white-space:nowrap}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{background:var(--btn)}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
.modal.open{display:flex}
.dialog{width:min(580px,100%);max-height:min(680px,calc(100vh - 32px));display:flex;flex-direction:column;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 65px var(--shadow)}
.dialog h2{margin:0;padding:16px 20px 6px;font-size:17px}
.dialog .body{padding:2px 20px 10px;overflow:auto;font-size:13px;line-height:1.65;word-break:keep-all}
.dialog .body h4{margin:14px 0 4px;font-size:13px;color:var(--accent)}
.dialog .body ul{margin:0;padding-left:18px}
.dialog .body li{margin:2px 0}
.dialog .foot{padding:10px 20px 14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.dialog .made{color:var(--muted);font-size:12px}
.captabs{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.captabs button{padding:4px 6px;min-width:28px}
.captabs button.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.captabs .caprt{margin-left:auto;display:flex;gap:4px}.captabs .muted{align-self:center}
.captabs .caprt button{font-size:12px;padding:4px 7px;min-width:0}
.pair input.chip,#gxChips input.chip{width:26px;height:28px}
.val{display:inline-flex;align-items:center}
.val .numin{width:36px;height:18px;padding:0 2px;font-size:12px;text-align:right;color:var(--accent);background:transparent;border:1px solid transparent;border-radius:4px;-moz-appearance:textfield}
.val .numin:hover{border-color:var(--input-line)}
.val .numin:focus{background:var(--input);border-color:var(--accent);outline:none}
.val .numin::-webkit-outer-spin-button,.val .numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.val em{font-style:normal;font-size:12px;margin-left:1px}
#gxChips{display:flex;gap:4px}
.pair>button{padding:3px 8px;flex:none}
.chkwrap{display:flex;flex-wrap:wrap;gap:3px 8px}
.chkwrap>label{display:flex;align-items:center;gap:4px;color:var(--chk);white-space:nowrap;font-size:13px}
.chkwrap>label:has(input:disabled){opacity:.45}
.borderSides{gap:2px 9px}
.borderSides>label{font-size:12px}
.pair.corners{gap:4px}
.pair.corners input{margin:0}
.pair>label{display:flex;align-items:center;gap:3px;color:var(--chk);white-space:nowrap}
input[type=range]{width:100%}
input[type=text],select,input[type=number]{
  width:100%;background:var(--input);border:1px solid var(--input-line);color:var(--text);
  border-radius:6px;padding:5px 8px
}
input[type=color]{
  width:46px;height:34px;padding:2px;border-radius:6px;
  background:var(--input);border:1px solid var(--input-line)
}
.inline{display:flex;gap:8px;align-items:center}
.inline>*:first-child{flex:1}
.drop{
  border:1px dashed var(--drop-line);border-radius:9px;padding:12px 14px;text-align:center;
  color:var(--drop-text);cursor:pointer;background:var(--drop-bg)
}
.drop:hover{border-color:#8a7b59;color:var(--drop-hover)}
.preview{
  position:relative;display:flex;align-items:center;justify-content:center;
  overflow:auto;
  background:
    radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:16px 16px;
}
canvas{
  max-width:90%;max-height:88%;
  box-shadow:0 24px 65px var(--shadow);
}
.hidden{display:none}
.hint{color:var(--hint);font-size:12px;margin-top:7px}
.badge{
  display:inline-block;background:var(--input);border:1px solid var(--badge-line);
  padding:3px 7px;border-radius:99px;font-size:11px;color:var(--badge-text)
}
@media(max-width:760px){
  body{overflow:auto;height:auto}header{position:sticky;top:0;z-index:4}
  main{height:auto;display:block}.preview{height:68vh;min-height:460px}
  aside{border-right:0;border-top:1px solid var(--line);grid-template-columns:1fr}.col+.col{border-left:0}
}

/* 사용 안내 투어 */
.guideTour{position:fixed;inset:0;z-index:1000}
.guideShade{position:fixed;background:rgba(0,0,0,.50);pointer-events:auto}
.guideTip{position:fixed;z-index:1002;width:min(410px,calc(100vw - 28px));background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 45px rgba(0,0,0,.45);padding:17px}
.guideStepCount{font-size:11px;color:var(--muted);margin-bottom:5px}
.guideJump{height:34px;min-width:132px;border:1px solid var(--input-line);background:var(--input);color:var(--text);border-radius:7px;padding:0 9px;font:inherit}
.guideTip h2{font-size:17px;margin:0 0 8px;color:var(--text)}
.guideTip p{margin:0;color:var(--label);font-size:13px;line-height:1.55}
.guideNav{display:flex;gap:7px;align-items:center;justify-content:flex-end;margin-top:15px}.guideNav .guideJump{flex:1 1 auto;min-width:0}.guideNav #guideClose{flex:0 0 auto;white-space:nowrap;min-width:58px}
.guideFocus{position:relative;z-index:1001;box-shadow:0 0 0 3px var(--accent),0 0 0 7px rgba(216,194,143,.25)!important;border-radius:8px!important}
</style>
</head>
<body>
<header>
  <div class="logo">✉ STAMP ATELIER</div>
  <div class="muted">single image stamp maker</div>
  <div class="spacer"></div>
  <div class="sizebox" id="saveSizeGroup" title="저장할 PNG 크기 (비율 유지)">
    <span class="muted">저장 크기</span>
    <input id="outW" type="number" min="1" max="8000" value="800">
    <span class="muted">×</span>
    <input id="outH" type="number" min="1" max="8000" value="533">
    <span class="muted">px</span>
  </div>
  <button id="guideBtn" title="사용 안내 보기">사용 안내</button>
  <button id="themeBtn" title="라이트/다크 전환">🌙 다크</button>
  <button id="settingsResetBtn" title="모든 설정을 기본값으로 되돌리고, 저장된 설정과 불러온 폰트·텍스처 파일도 지웁니다">설정 초기화</button>
  <button id="resetBtn">새로 만들기</button>
  <button id="saveBtn" class="primary">PNG 저장</button>
</header>

<main>
<aside>
<div class="col">
  <div class="section" id="imageSection">
    <h3>이미지</h3>
    <div id="drop" class="drop">
      <div>＋ 이미지를 불러오세요</div>
      <div class="hint">한 장만 사용합니다 · 원본 비율 자동 적용</div>
    </div>
    <input id="file" class="hidden" type="file" accept="image/*">
    <div id="fileName" class="hint"></div>
  </div>

  <div class="section" id="adjustSection">
    <h3>이미지 조정</h3>
    <div class="field">
      <label>확대 <span id="scaleVal">100%</span></label>
      <input id="scale" type="range" min="50" max="160" value="100">
    </div>
    <div class="field">
      <label>회전 <span id="rotationVal">0°</span></label>
      <input id="rotation" type="range" min="-180" max="180" value="0">
    </div>
    <div class="field">
      <label>밝기 <span id="brightnessVal">100%</span></label>
      <input id="brightness" type="range" min="50" max="150" value="100">
    </div>
    <div class="field">
      <label>가로 이동 <span id="imgXVal">0%</span></label>
      <input id="imgX" type="range" min="-50" max="50" step="0.5" value="0">
    </div>
    <div class="field">
      <label>세로 이동 <span id="imgYVal">0%</span></label>
      <input id="imgY" type="range" min="-50" max="50" step="0.5" value="0">
    </div>
    <div class="field" style="align-items:start">
      <label>이동 제한</label>
      <div class="chkwrap">
        <label title="이미지는 자유롭게 움직이되, 액자 틀 밖으로 나간 부분은 보이지 않게 숨김"><input id="limitMove" type="checkbox">액자 안에서만</label>
        <label title="'액자 안에서만'과 함께 켜면, 이미지가 보이는 부분만큼만 액자 테두리선이 이미지를 둘러요"><input id="frameWrap" type="checkbox" disabled>액자 유지</label>
        <label title="'액자 안에서만'이 꺼져 있을 때, 이미지를 움직이면 액자 테두리선도 같이 움직여요"><input id="frameFollow" type="checkbox">액자도 이동</label>
      </div>
    </div>
    <div class="btns"><button id="undoBtn" disabled>↶ 되돌리기</button><button id="centerBtn">중앙으로</button><button id="adjResetBtn">초기화</button></div>
  </div>

  <div class="section" id="filterSection">
    <h3>이미지 필터</h3>
    <div class="field">
      <label>필터</label>
      <select id="filterType">
        <option value="none">없음</option>
        <option value="gray">흑백</option>
        <option value="sepia">세피아</option>
        <option value="vintage">빈티지</option>
        <option value="vivid">선명하게</option>
        <option value="fade">페이드</option>
        <option value="noir">흑백 대비</option>
        <option value="blur">블러</option>
        <option value="invert">반전</option>
        <option value="hue">색조 변경</option>
      </select>
    </div>
    <div class="field">
      <label>강도 <span id="filterAmtVal">100%</span></label>
      <input id="filterAmt" type="range" min="0" max="100" value="100">
    </div>
  </div>

  <div class="section" id="cornerSection">
    <h3>이미지 모서리</h3>
    <div class="field">
      <label>모양</label>
      <select id="cornerStyle">
        <option value="round">둥글게</option>
        <option value="cut">사선 컷</option>
        <option value="notch">안쪽 둥글게</option>
      </select>
    </div>
    <div class="field">
      <label>크기 <span id="cornerSizeVal">0 px</span></label>
      <input id="cornerSize" type="range" min="0" max="200" value="0">
    </div>
    <div class="field">
      <label>적용 모서리</label>
      <div class="pair corners">
        <label><input id="cnTL" type="checkbox" checked>↖</label>
        <label><input id="cnTR" type="checkbox" checked>↗</label>
        <label><input id="cnBL" type="checkbox" checked>↙</label>
        <label><input id="cnBR" type="checkbox" checked>↘</label>
      </div>
    </div>
  </div>

  <div class="section" id="marginSection">
    <h3>여백 색상</h3>
    <div class="field">
      <label>색상 · 방식</label>
      <div class="pair">
        <input id="paperColor" class="chip" type="color" value="#f8f5ec" title="시작 색">
        <input id="paperColor2" class="chip hidden" type="color" value="#d8c28f" title="두 번째 색">
        <select id="gradMode">
          <option value="none">단색</option>
          <option value="lin">그라데이션</option>
        </select>
      </div>
    </div>
    <div id="gradMore" class="hidden">
      <div class="field">
        <label>추가 색상</label>
        <div class="pair">
          <button id="gxAdd" title="색상 추가 (최대 5색)">＋</button>
          <button id="gxDel" title="마지막 추가 색상 삭제">－</button>
          <span id="gxChips"></span>
        </div>
      </div>
      <div class="field">
        <label>각도 <span id="gradAngleVal">90°</span></label>
        <input id="gradAngle" type="range" min="0" max="360" value="90">
      </div>
    </div>
  </div>

  <div class="section" id="textureSection">
    <h3>종이 질감</h3>
    <div class="field">
      <label>질감 종류</label>
      <select id="textureStyle">
        <option value="none">없음</option>
        <option value="dot" selected>기본 (점)</option>
        <option value="fiber">섬유</option>
        <option value="laid">줄무늬 (레이드지)</option>
        <option value="canvas">캔버스 (직조)</option>
        <option value="stain">얼룩 (빈티지)</option>
        <option value="grain">필름 입자</option>
        <option value="custom">내 이미지…</option>
      </select>
    </div>
    <div class="field">
      <label>종이 질감 <span id="textureVal">12%</span></label>
      <input id="texture" type="range" min="0" max="100" value="12">
    </div>
    <div id="texCustom" class="hidden">
      <div class="field">
        <label>텍스처</label>
        <button id="texBtn">이미지 불러오기</button>
      </div>
      <div class="field">
        <label>배치</label>
        <select id="texFit"><option value="cover">채우기</option><option value="tile">반복 (타일)</option></select>
      </div>
      <div class="field">
        <label>섞기</label>
        <select id="texBlend"><option value="multiply">곱하기</option><option value="overlay">오버레이</option><option value="source-over">일반</option></select>
      </div>
      <input id="texFile" class="hidden" type="file" accept="image/*">
      <div id="texName" class="hint">강도는 위의 "종이 질감" 슬라이더로 조절해요</div>
    </div>
  </div>
</div>

<div class="col">
  <div class="section" id="borderSection">
    <h3>우표 테두리</h3>
    <div class="field">
      <label>테두리 스타일</label>
      <select id="borderStyle">
        <option value="classic">클래식 톱니</option>
        <option value="clean">얇은 톱니</option>
        <option value="square">사각 톱니</option>
        <option value="zigzag">삼각 톱니</option>
        <option value="scallop">물결</option>
        <option value="ticket">티켓 노치</option>
        <option value="bevel">사선 모서리</option>
        <option value="round">둥근 모서리</option>
        <option value="none">없음</option>
      </select>
    </div>
    <div class="field">
      <label>테두리 방향</label>
      <div class="chkwrap borderSides">
        <label><input id="borderTop" type="checkbox" checked> 상</label>
        <label><input id="borderBottom" type="checkbox" checked> 하</label>
        <label><input id="borderLeft" type="checkbox" checked> 좌</label>
        <label><input id="borderRight" type="checkbox" checked> 우</label>
      </div>
    </div>
    <div class="field">
      <label>톱니 크기 <span id="perfVal">100%</span></label>
      <input id="perf" type="range" min="50" max="800" value="100">
    </div>
    <div class="field">
      <label>여백 <span id="marginVal">46 px</span></label>
      <input id="margin" type="range" min="0" max="120" value="46">
    </div>
    <div id="edgeCutField" class="field hidden">
      <label>깎는 크기 <span id="edgeCutVal">28px</span></label>
      <input id="edgeCut" type="range" min="0" max="120" value="28">
    </div>
    <div id="borderColorField" class="field hidden">
      <label>테두리 색상</label>
      <div class="inline"><input id="borderColor" type="color" value="#f8f5ec"><span class="muted">둥근 테두리선 색</span></div>
    </div>
    <div class="field">
      <label for="frame">이미지 테두리</label>
      <label class="chk"><input id="frame" type="checkbox" checked> 액자 외곽선 표시</label>
    </div>
  </div>



  <div class="section collapsible" id="captionSection">
    <h3>문구</h3>
    <div class="captabs" id="capTabs"></div>
    <div class="field"><input id="caption" type="text" placeholder="예: KOREA · 2026"></div>
    <div class="field">
      <label>글꼴 · 색</label>
      <div class="pair">
        <select id="captionFont">
          <option value="serif">세리프 (기본)</option>
          <option value="sans">고딕</option>
          <option value="myeongjo">명조</option>
          <option value="mono">모노스페이스</option>
          <option value="script">필기체</option>
          <option value="heavy">굵은 고딕</option>
          <option value="__load">＋ 폰트 불러오기…</option>
        </select>
        <input id="captionColor" type="color" value="#1e1c18" title="글자 색">
        <input id="fontFile" class="hidden" type="file" accept=".ttf,.otf,.woff,.woff2">
      </div>
    </div>
    <div class="field">
      <label>스타일</label>
      <div class="pair">
        <label><input id="capBold" type="checkbox" checked>굵게</label>
        <label><input id="capItalic" type="checkbox">기울임</label>
      </div>
    </div>
    <div class="field">

<script>

// ---- 사용 안내: 실제 UI를 하나씩 강조하는 투어 ----
const GUIDE_STEPS=[
  {sel:'#saveSizeGroup',title:'저장 크기',body:'저장할 PNG의 너비와 높이를 정합니다. 한쪽 값을 바꾸면 이미지 비율에 맞춰 다른 쪽도 자동으로 계산됩니다. 최대 8000px까지 사용할 수 있어요.',side:'bottom'},
  {sel:'#guideBtn',title:'사용 안내',body:'필요할 때 이 안내를 다시 열 수 있습니다. 아래 선택 메뉴에서 원하는 기능으로 곧바로 이동할 수도 있어요.',side:'bottom'},
  {sel:'#themeBtn',title:'화면 테마',body:'라이트/다크 화면을 전환합니다. 이 설정은 작업 결과물의 PNG 색상이나 투명도에는 영향을 주지 않아요.',side:'bottom'},
  {sel:'#settingsResetBtn',title:'설정 초기화',body:'저장된 설정과 불러온 폰트·텍스처 파일을 지우고 기본 설정으로 되돌립니다. 우표에 올린 이미지 자체를 지우는 기능은 아닙니다.',side:'bottom'},
  {sel:'#resetBtn',title:'새로 만들기',body:'현재 불러온 이미지와 꾸미기 요소를 비우고 새 작업을 시작합니다.',side:'bottom'},
  {sel:'#saveBtn',title:'PNG 저장',body:'현재 미리보기 결과를 PNG 파일로 저장합니다. 위에서 지정한 저장 크기로 출력됩니다.',side:'bottom'},
  {sel:'#imageSection',title:'이미지',body:'사용할 원본 이미지를 한 장 불러오는 곳입니다. 이미지를 끌어다 놓는 것도 가능합니다.',side:'right'},
  {sel:'#adjustSection',title:'이미지 조정',body:'원본 이미지의 확대·축소, 회전, 밝기, 위치 등을 조절합니다. 되돌리기·중앙으로·초기화도 여기에서 사용할 수 있어요.',side:'right'},
  {sel:'#filterSection',title:'이미지 필터',body:'원본 이미지의 분위기와 색감을 조절하는 필터 메뉴입니다.',side:'right'},
  {sel:'#cornerSection',title:'이미지 모서리',body:'이미지 모서리 모양과 크기를 조절합니다. 둥글게, 사선 컷, 안쪽 둥글게 등의 형태를 선택할 수 있어요.',side:'right'},
  {sel:'#marginSection',title:'여백 색상',body:'이미지 주변 여백의 색상을 설정합니다. 단색이나 여러 색을 이용한 그라데이션을 사용할 수 있어요.',side:'right'},
  {sel:'#borderSection',title:'우표 테두리',body:'우표의 톱니·물결 같은 테두리 스타일과 톱니 크기, 여백, 외곽선 등을 설정합니다. 테두리 방향에서 상·하·좌·우를 개별적으로 끌 수도 있어요.',side:'right'},
  {sel:'#textureSection',title:'종이 질감',body:'우표에 적용할 종이 질감의 종류와 강도를 설정합니다. 원하는 질감 이미지를 직접 불러올 수도 있어요.',side:'right'},
  {sel:'#captionSection',title:'문구',body:'문구를 추가하고 글꼴, 색, 크기, 자간, 비율, 회전, 투명도, 위치, 외곽선 등을 조절합니다. 최대 4개의 문구 레이어를 사용할 수 있으며, 제목을 눌러 메뉴를 접을 수도 있어요.',side:'right'},
  {sel:'#stickerSection',title:'이미지 스티커',body:'별도의 이미지 스티커를 최대 5장 추가할 수 있습니다. 스티커마다 크기, 회전, 투명도, 위치와 테두리를 따로 조절할 수 있어요. 이 메뉴 역시 제목을 눌러 접을 수 있습니다.',side:'right'}

let guideIndex=0, guidePrevFocus=null, guideCollapsedState={};
function guideTarget(step){return document.querySelector(step.sel)}
function guideClearFocus(){document.querySelectorAll('.guideFocus').forEach(e=>e.classList.remove('guideFocus'));}
function guideSetShades(r){
  const top=$('guideShadeTop'),right=$('guideShadeRight'),bottom=$('guideShadeBottom'),left=$('guideShadeLeft');
  const pad=5, x=Math.max(0,r.left-pad), y=Math.max(0,r.top-pad), rr=Math.min(innerWidth,r.right+pad), bb=Math.min(innerHeight,r.bottom+pad);
  top.style.cssText=`left:0;top:0;width:100%;height:${y}px`;
  bottom.style.cssText=`left:0;top:${bb}px;width:100%;height:${Math.max(0,innerHeight-bb)}px`;
  left.style.cssText=`left:0;top:${y}px;width:${x}px;height:${Math.max(0,bb-y)}px`;
  right.style.cssText=`left:${rr}px;top:${y}px;width:${Math.max(0,innerWidth-rr)}px;height:${Math.max(0,bb-y)}px`;
}
function guidePlaceTip(r,side){
  const tip=$('guideTip'); const gap=16; const w=tip.offsetWidth, h=tip.offsetHeight;
  let x,y;
  if(side==='bottom'){x=r.left+r.width/2-w/2;y=r.bottom+gap}
  else if(side==='top'){x=r.left+r.width/2-w/2;y=r.top-h-gap}
  else if(side==='left'){x=r.left-w-gap;y=r.top+r.height/2-h/2}
  else{x=r.right+gap;y=r.top+r.height/2-h/2}
  x=Math.max(12,Math.min(innerWidth-w-12,x)); y=Math.max(12,Math.min(innerHeight-h-12,y));
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function guidePrepareTarget(t){
  if(t?.classList.contains('collapsible')){
    const id=t.id;
    if(!(id in guideCollapsedState)) guideCollapsedState[id]=t.classList.contains('collapsed');
    t.classList.remove('collapsed');
  }
  t?.scrollIntoView({block:'center',inline:'nearest',behavior:'instant'});
}
function guideShow(i){
  guideIndex=Math.max(0,Math.min(GUIDE_STEPS.length-1,i));
  const step=GUIDE_STEPS[guideIndex], t=guideTarget(step); if(!t)return;
  guideClearFocus(); guidePrepareTarget(t); t.classList.add('guideFocus');
  const r=t.getBoundingClientRect(); guideSetShades(r);
  $('guideStepCount').textContent=`${guideIndex+1} / ${GUIDE_STEPS.length}`;
  $('guideJump').value=String(guideIndex);
  $('guideStepTitle').textContent=step.title; $('guideStepBody').innerHTML=`<p>${step.body}</p>`;
  guidePlaceTip(r,step.side||'right');
}
function guideCloseTour(){
  guideClearFocus();
  for(const [id,was] of Object.entries(guideCollapsedState)){const e=$(id);if(e)e.classList.toggle('collapsed',was)}
  guideCollapsedState={}; $('guide').hidden=true; $('guide').setAttribute('aria-hidden','true'); document.body.style.overflow='';
  if(guidePrevFocus?.focus)guidePrevFocus.focus();
}
function guideOpen(){
  guidePrevFocus=document.activeElement;
  guideIndex=0;
  $('guide').hidden=false; $('guide').setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
  guideShow(guideIndex);
  $('guideJump').focus();
}
GUIDE_STEPS.forEach((step,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=`${i+1}. ${step.title}`;$('guideJump').appendChild(o)});
$('guideBtn').addEventListener('click',()=>guideOpen());
$('guideClose').addEventListener('click',guideCloseTour);
$('guideJump').addEventListener('change',e=>guideShow(+e.target.value));
document.addEventListener('keydown',e=>{
  if($('guide').hidden)return;
  if(e.key==='Escape')guideCloseTour();
  else if(e.key==='ArrowRight')guideShow(guideIndex+1);
  else if(e.key==='ArrowLeft')guideShow(guideIndex-1);
  else if(e.key==='Home')guideShow(0);
  else if(e.key==='End')guideShow(GUIDE_STEPS.length-1);
});
window.addEventListener('resize',()=>{if(!$('guide').hidden)guideShow(guideIndex)});

// 문구/스티커 메뉴는 제목을 눌러 접었다 펼칠 수 있습니다.
function setupCollapsibleSection(id, storageKey){
  const section=$(id);
  if(!section) return;
  const title=section.querySelector("h3");
  if(!title) return;
  title.setAttribute("role","button");
  title.setAttribute("tabindex","0");
  const setCollapsed=collapsed=>{
    section.classList.toggle("collapsed",collapsed);
    title.setAttribute("aria-expanded",String(!collapsed));
    try{localStorage.setItem(storageKey,collapsed?"1":"0")}catch(e){}
  };
  let collapsed=false;
  try{collapsed=localStorage.getItem(storageKey)==="1"}catch(e){}
  setCollapsed(collapsed);
  const toggle=()=>setCollapsed(!section.classList.contains("collapsed"));
  title.addEventListener("click",toggle);
  title.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}
  });
}
setupCollapsibleSection("captionSection","stampAtelier.captionCollapsed");
setupCollapsibleSection("stickerSection","stampAtelier.stickerCollapsed");

const canvas = $("canvas"), ctx = canvas.getContext("2d");

let img = null;
let offsetX = 0, offsetY = 0;
let scale = 1, rotation = 0, brightness = 1;

function setText(id, value){
  const el=$(id);
  if(el._inp){ // 값 표시가 입력칸으로 바뀐 슬라이더: 숫자만 입력칸에, 단위는 옆 글자에
    const m=String(value).match(/^(-?[\d.]+)\s*(.*)$/);
    if(m){ if(document.activeElement!==el._inp) el._inp.value=m[1]; el._unit.textContent=m[2]; return; }
  }
  el.textContent=value;
}
// 슬라이더 옆의 값 표시를 직접 입력할 수 있는 숫자칸으로 바꿈 (범위를 벗어나면 가장 가까운 값으로 맞춤)
function enhanceValueBoxes(){
  document.querySelectorAll("aside .field").forEach(f=>{
    const rng=f.querySelector("input[type=range]"), sp=f.querySelector('label span[id$="Val"]');
    if(!rng||!sp) return;
    const m=sp.textContent.trim().match(/^(-?[\d.]+)\s*(.*)$/); if(!m) return;
    sp.textContent=""; sp.classList.add("val");
    const inp=document.createElement("input");
    inp.type="number"; inp.className="numin"; inp.min=rng.min; inp.max=rng.max; inp.step=rng.step||1; inp.value=m[1];
    inp.title=`직접 입력 (${rng.min} ~ ${rng.max})`;
    const un=document.createElement("em"); un.textContent=m[2];
    sp.append(inp,un); sp._inp=inp; sp._unit=un;
    const apply=final=>{
      let v=parseFloat(inp.value); const lo=+rng.min, hi=+rng.max;
      if(!isFinite(v)){ if(final) inp.value=rng.value; return; }
      if(!final && (v<lo||v>hi)) return;       // 타이핑 도중(예: 50을 치려고 5까지 친 상태)에는 범위 밖 값을 건드리지 않음
      v=Math.min(hi,Math.max(lo,v)); rng.value=v;
      rng.dispatchEvent(new Event("input",{bubbles:true}));
      if(final){ rng.dispatchEvent(new Event("change",{bubbles:true})); inp.value=rng.value; }
    };
    inp.addEventListener("input",()=>apply(false));
    inp.addEventListener("change",()=>apply(true));
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") inp.blur(); });
  });
}

const CAPTION_FONTS={
  serif:'Georgia, "Times New Roman", serif',
  sans:'system-ui, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif',
  myeongjo:'"Nanum Myeongjo", Batang, "Noto Serif KR", AppleMyungjo, serif',
  mono:'"Courier New", Consolas, monospace',
  script:'"Brush Script MT", "Segoe Script", "Apple Chancery", cursive',
  heavy:'Impact, "Arial Black", "Malgun Gothic", sans-serif'
};
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function syncOut(){ $("outW").value=canvas.width; $("outH").value=canvas.height; }

// ---- 문구: 최대 4개. 탭으로 고른 문구를 입력칸에서 편집하고, + 는 현재 문구 설정을 복사해 새 문구를 만듦 ----
const CAP_MAX=4;
const capDefault=()=>({text:"",font:"serif",color:"#1e1c18",size:34,bold:true,italic:false,spacing:0,sx:100,sy:100,x:0,y:0,outline:0,outlineColor:"#ffffff",rot:0,alpha:12,blend:"source-over"});
let captions=[capDefault()], capCur=0;
let capHist=[[]], capCommitted=[{...captions[0]}];
function capClone(c){ return {...c}; }
function capCommit(){
  const cur=readCap(), prev=capCommitted[capCur];
  if(!prev || JSON.stringify(cur)!==JSON.stringify(prev)){
    capHist[capCur]=capHist[capCur]||[]; capHist[capCur].push(capClone(prev||capDefault()));
    if(capHist[capCur].length>50) capHist[capCur].shift();
    capCommitted[capCur]=capClone(cur);
    renderTabs();
  }
}
function undoCap(){
  const h=capHist[capCur]; if(!h||!h.length) return;
  const prev=h.pop();
  captions[capCur]=capClone(prev); capCommitted[capCur]=capClone(prev);
  writeCap(captions[capCur]); renderTabs(); draw();
}
function resetCap(){
  capCommit();
  capHist[capCur]=capHist[capCur]||[]; capHist[capCur].push(capClone(readCap()));
  captions[capCur]=capDefault(); capCommitted[capCur]=capClone(captions[capCur]);
  writeCap(captions[capCur]); renderTabs(); draw();
}
function readCap(){
  return {text:$("caption").value, font:$("captionFont").value, color:$("captionColor").value,
    size:+$("fontSize").value, bold:$("capBold").checked, italic:$("capItalic").checked,
    spacing:+$("capSpacing").value, sx:+$("capScaleX").value, sy:+$("capScaleY").value,
    x:+$("captionX").value, y:+$("captionY").value,
    outline:+$("captionOutline").value, outlineColor:$("captionOutlineColor").value,
    rot:+$("capRot").value, alpha:+$("capAlpha").value, blend:$("capBlend").value};
}
function writeCap(c){
  $("caption").value=c.text;
  const sel=$("captionFont");
  sel.value=[...sel.options].some(o=>o.value===c.font)?c.font:"serif"; prevFont=sel.value;
  $("captionColor").value=c.color;
  $("capBold").checked=!!c.bold; $("capItalic").checked=!!c.italic;
  const set=(id,v,lab,suf)=>{ $(id).value=v; setText(lab,`${v}${suf}`); };
  set("fontSize",c.size,"fontVal"," px"); set("capSpacing",c.spacing,"capSpacingVal"," px");
  set("capScaleX",c.sx,"capScaleXVal","%"); set("capScaleY",c.sy,"capScaleYVal","%");
  set("captionX",c.x,"captionXVal","%"); set("captionY",c.y,"captionYVal","%");
  set("captionOutline",c.outline,"captionOutlineVal"," px");
  set("capRot",c.rot,"capRotVal","°"); set("capAlpha",c.alpha,"capAlphaVal","%");
  const bl=$("capBlend"); bl.value=[...bl.options].some(o=>o.value===c.blend)?c.blend:"source-over";
  $("captionOutlineColor").value=c.outlineColor;
}
function selectCap(i){ capCommit(); captions[capCur]=readCap(); capCur=i; writeCap(captions[i]); renderTabs(); draw(); }
function addCap(){
  if(captions.length>=CAP_MAX) return;
  capCommit(); captions[capCur]=readCap(); captions.push({...captions[capCur]}); capHist.push([]); capCommitted.push(capClone(captions[capCur+1])); capCur=captions.length-1;
  writeCap(captions[capCur]); renderTabs(); draw();
}
function moveCap(d){ // 1번이 가장 위 레이어. 선택한 문구를 앞/뒤 번호와 맞바꿈
  const j=capCur+d; if(j<0||j>=captions.length) return;
  capCommit(); captions[capCur]=readCap(); [captions[capCur],captions[j]]=[captions[j],captions[capCur]]; [capHist[capCur],capHist[j]]=[capHist[j],capHist[capCur]]; [capCommitted[capCur],capCommitted[j]]=[capCommitted[j],capCommitted[capCur]]; capCur=j;
  writeCap(captions[capCur]); renderTabs(); draw();
}
function delCap(){
  if(captions.length<2) return;
  capCommit(); captions.splice(capCur,1); capHist.splice(capCur,1); capCommitted.splice(capCur,1); capCur=Math.min(capCur,captions.length-1);
  writeCap(captions[capCur]); renderTabs(); draw();
}
$("capUndo").onclick=undoCap;
$("capReset").onclick=resetCap;
$("capDelete").onclick=delCap;
function renderTabs(){
  const box=$("capTabs"); box.innerHTML="";
  $("capUndo").disabled=!(capHist[capCur]?.length);
  $("capDelete").disabled=captions.length<2;
  captions.forEach((c,i)=>{
    const b=document.createElement("button");
    b.textContent=i+1; b.title=`문구 ${i+1}`; if(i===capCur) b.classList.add("active");
    b.onclick=()=>selectCap(i); box.appendChild(b);
  });
  const add=document.createElement("button");
  add.textContent="+"; add.title=`문구 추가 (현재 문구 설정을 복사, 최대 ${CAP_MAX}개)`;
  add.disabled=captions.length>=CAP_MAX; add.onclick=addCap; box.appendChild(add);
  const rt=document.createElement("span"); rt.className="caprt"; rt.style.display=captions.length<2?"none":"";
  const mk=(txt,title,fn,dis)=>{ const b=document.createElement("button"); b.textContent=txt; b.title=title; b.disabled=dis; b.onclick=fn; rt.appendChild(b); };
  mk("◀","레이어 앞으로 (1번이 가장 위에 그려져요)",()=>moveCap(-1),capCur===0);
  mk("▶","레이어 뒤로 (번호가 클수록 아래에 그려져요)",()=>moveCap(1),capCur===captions.length-1);
  box.appendChild(rt);
}
// 자간 적용 텍스트 (letterSpacing 미지원 브라우저는 글자별로 직접 배치)
function fillSpaced(g,text,x,y,sp,stroke){
  if("letterSpacing" in g){
    g.letterSpacing=sp+"px";
    const dx=sp/2; // 마지막 글자 뒤에도 자간이 붙어 가운데 정렬이 어긋나는 것을 보정
    stroke?g.strokeText(text,x+dx,y):g.fillText(text,x+dx,y);
  } else {
    const chars=[...text], ws=chars.map(ch=>g.measureText(ch).width);
    let cx=x-(ws.reduce((a,b)=>a+b,0)+sp*(chars.length-1))/2;
    g.textAlign="left";
    chars.forEach((ch,i)=>{ stroke?g.strokeText(ch,cx,y):g.fillText(ch,cx,y); cx+=ws[i]+sp; });
    g.textAlign="center";
  }
}
let capLayer=null; // 문구를 임시 캔버스에 그린 뒤 투명도를 적용 (외곽선·채움이 겹쳐도 한 덩어리로 투명해짐)
function drawCaption(c,w,h){
  const text=c.text.trim(); if(!text) return;
  if(!capLayer||capLayer.width!==w||capLayer.height!==h){ capLayer=document.createElement("canvas"); capLayer.width=w; capLayer.height=h; }
  const g=capLayer.getContext("2d"); g.clearRect(0,0,w,h);
  const size=c.size, by=size*.35;                       // by: 글자 시각적 중심 → 기준선 거리
  const cx=w/2+c.x/100*w, cy=h/2+c.y/100*h;             // 글자 중심 위치
  g.save();
  g.translate(cx,cy); g.rotate(c.rot*Math.PI/180); g.scale(c.sx/100,c.sy/100);   // 중심 기준 회전 → 글자 방향으로 늘이기
  g.font=`${c.italic?"italic ":""}${c.bold?600:400} ${size}px ${CAPTION_FONTS[c.font]||CAPTION_FONTS.serif}`;
  g.textAlign="center";
  if(c.outline>0){
    g.lineJoin="round"; g.lineWidth=c.outline*2; g.strokeStyle=c.outlineColor;
    fillSpaced(g,text,0,by,c.spacing,true);
  }
  g.fillStyle=c.color;
  g.shadowColor="rgba(255,255,255,.35)"; g.shadowBlur=2;
  fillSpaced(g,text,0,by,c.spacing,false);
  g.restore();
  ctx.save(); ctx.globalAlpha=1-c.alpha/100; ctx.globalCompositeOperation=c.blend||"source-over"; ctx.drawImage(capLayer,0,0); ctx.restore();
}

function autoSize(image){
  // 화면과 출력 모두에서 과도하게 커지지 않도록 기준 긴 변을 1200px로 맞춤.
  const maxSide = 1200;
  const k = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
  const iw = Math.max(200, Math.round(image.naturalWidth * k));
  const ih = Math.max(200, Math.round(image.naturalHeight * k));
  clearTextureCache();
  canvas.width = iw;
  canvas.height = ih;
  syncOut();
  offsetX = 0; offsetY = 0; scale = 1; rotation = 0;
  $("scale").value = 100; $("rotation").value = 0;
  setText("scaleVal","100%"); setText("rotationVal","0°");
  hist=[]; committed=adjKeys(); updateUndo();
  draw();
}

function loadFile(file){
  if(!file || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = e => {
    const image = new Image();
    image.onload = () => {
      img = image;
      $("fileName").textContent = `${file.name} · ${image.naturalWidth} × ${image.naturalHeight}px`;
      autoSize(image);
    };
    image.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

$("drop").onclick = () => $("file").click();
$("file").onchange = e => loadFile(e.target.files[0]);

$("drop").ondragover = e => { e.preventDefault(); $("drop").style.borderColor = "#b99b61"; };
$("drop").ondragleave = () => $("drop").style.borderColor = "";
$("drop").ondrop = e => {
  e.preventDefault(); $("drop").style.borderColor = "";
  loadFile(e.dataTransfer.files[0]);
};

function getBorderSides(){
  return {top:$("borderTop").checked,bottom:$("borderBottom").checked,left:$("borderLeft").checked,right:$("borderRight").checked};
}

function drawPerforatedRect(x,y,w,h, color, step=18, radius=5.2){
  // 가장자리의 작은 원을 투명하게 도려내어 실제 우표의 천공처럼 표현합니다.
  ctx.save();
  ctx.globalCompositeOperation = "destination-out";

  // 모서리는 구멍 없이 온전한 이빨로 남기고, 모서리 이빨 폭 = 다른 이빨 폭이 되도록 간격 계산
  const topN = Math.max(2, Math.floor((w+2*radius)/step));
  const sideN = Math.max(2, Math.floor((h+2*radius)/step));
  const tw = (w+2*radius)/topN, th = (h+2*radius)/sideN;
  const sides = getBorderSides();

  ctx.fillStyle = "#000";
  for(let i=1;i<topN;i++){
    const cx = x + i*tw - radius;
    if(sides.top){ctx.beginPath(); ctx.arc(cx, y, radius, 0, Math.PI*2); ctx.fill();}
    if(sides.bottom){ctx.beginPath(); ctx.arc(cx, y+h, radius, 0, Math.PI*2); ctx.fill();}
  }
  for(let i=1;i<sideN;i++){
    const cy = y + i*th - radius;
    if(sides.left){ctx.beginPath(); ctx.arc(x, cy, radius, 0, Math.PI*2); ctx.fill();}
    if(sides.right){ctx.beginPath(); ctx.arc(x+w, cy, radius, 0, Math.PI*2); ctx.fill();}
  }
  ctx.restore();
}

// 추가 테두리 스타일: 사각 톱니 / 삼각 톱니 / 물결 / 티켓 노치 / 사선 모서리
const EDGE_LW=12; // 둥근 모서리 스타일의 테두리 두께 (여백과 무관하게 고정)
function drawEdgeStyle(style, w, h, pk){
  const r=5.2*pk, sides=getBorderSides();
  ctx.save();
  ctx.globalCompositeOperation="destination-out";
  ctx.fillStyle="#000";
  if(style==="ticket"||style==="bevel"){
    const R=Math.max(14,r*3);
    const corners=[
      [0,0,sides.top&&sides.left],[w,0,sides.top&&sides.right],
      [0,h,sides.bottom&&sides.left],[w,h,sides.bottom&&sides.right]
    ];
    for(const [cx,cy,on] of corners){
      if(!on) continue;
      const sx=cx===0?1:-1, sy=cy===0?1:-1;
      ctx.beginPath();
      if(style==="ticket") ctx.arc(cx,cy,R,0,Math.PI*2);
      else{const L=Math.min(+$("edgeCut").value,w/2,h/2);ctx.moveTo(cx,cy);ctx.lineTo(cx+sx*L,cy);ctx.lineTo(cx,cy+sy*L);ctx.closePath();}
      ctx.fill();
    }
  } else if(style==="zigzag"){
    const S=r*3.2, d=S*.6;
    const nx=Math.max(2,Math.round(w/S)), ny=Math.max(2,Math.round(h/S));
    const tx=w/nx, ty=h/ny;
    if(sides.top) for(let i=0;i<nx;i++){
      if((i===0&&!sides.left)||(i===nx-1&&!sides.right)) continue;
      const a=i*tx,b=a+tx,m=(a+b)/2;
      ctx.beginPath();ctx.moveTo(a,0);ctx.lineTo(b,0);ctx.lineTo(m,d);ctx.closePath();ctx.fill();
    }
    if(sides.bottom) for(let i=0;i<nx;i++){
      if((i===0&&!sides.left)||(i===nx-1&&!sides.right)) continue;
      const a=i*tx,b=a+tx,m=(a+b)/2;
      ctx.beginPath();ctx.moveTo(a,h);ctx.lineTo(b,h);ctx.lineTo(m,h-d);ctx.closePath();ctx.fill();
    }
    if(sides.left) for(let i=0;i<ny;i++){
      if((i===0&&!sides.top)||(i===ny-1&&!sides.bottom)) continue;
      const a=i*ty,b=a+ty,m=(a+b)/2;
      ctx.beginPath();ctx.moveTo(0,a);ctx.lineTo(0,b);ctx.lineTo(d,m);ctx.closePath();ctx.fill();
    }
    if(sides.right) for(let i=0;i<ny;i++){
      if((i===0&&!sides.top)||(i===ny-1&&!sides.bottom)) continue;
      const a=i*ty,b=a+ty,m=(a+b)/2;
      ctx.beginPath();ctx.moveTo(w,a);ctx.lineTo(w,b);ctx.lineTo(w-d,m);ctx.closePath();ctx.fill();
    }
  } else if(style==="scallop"){
    // 물결: 선택한 변만 파고, 인접한 변을 끈 모서리는 보존합니다.
    const S=r*3.6;
    const nx=Math.max(2,Math.round(w/S)), ny=Math.max(2,Math.round(h/S));
    const sx=w/nx, sy=h/ny;
    const bite=(cx,cy,rad)=>{ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fill();};
    if(sides.top) for(let i=0;i<=nx;i++){if((i===0&&!sides.left)||(i===nx&&!sides.right)) continue;bite(i*sx,0,sx/2+.5);}
    if(sides.bottom) for(let i=0;i<=nx;i++){if((i===0&&!sides.left)||(i===nx&&!sides.right)) continue;bite(i*sx,h,sx/2+.5);}
    if(sides.left) for(let i=0;i<=ny;i++){if((i===0&&!sides.top)||(i===ny&&!sides.bottom)) continue;bite(0,i*sy,sy/2+.5);}
    if(sides.right) for(let i=0;i<=ny;i++){if((i===0&&!sides.top)||(i===ny&&!sides.bottom)) continue;bite(w,i*sy,sy/2+.5);}
  } else { // square: 모서리는 온전히 남기고 이빨 폭이 같도록 간격 계산
    const S=18*Math.max(1,pk);
    const nx=Math.max(2,Math.floor((w+2*r)/S)), ny=Math.max(2,Math.floor((h+2*r)/S));
    const sx=(w+2*r)/nx, sy=(h+2*r)/ny;
    const cut=(cx,cy)=>ctx.fillRect(cx-r,cy-r,2*r,2*r);
    if(sides.top) for(let i=1;i<nx;i++){const cx=i*sx-r;cut(cx,0);}
    if(sides.bottom) for(let i=1;i<nx;i++){const cx=i*sx-r;cut(cx,h);}
    if(sides.left) for(let i=1;i<ny;i++){const cy=i*sy-r;cut(0,cy);}
    if(sides.right) for(let i=1;i<ny;i++){const cy=i*sy-r;cut(w,cy);}
  }
  ctx.restore();
}

// 이미지 모서리(라운딩/컷/안쪽 둥글게) 경로. 액자 외곽선도 같은 경로를 써서 모양이 맞춰짐.
function getShape(){
  return {style:$("cornerStyle").value,size:+$("cornerSize").value,
          cn:[$("cnTL").checked,$("cnTR").checked,$("cnBR").checked,$("cnBL").checked]};
}
function framePath(c,x,y,W,H,sh){
  c.beginPath();
  const r=Math.max(0,Math.min(sh.size,W/2,H/2));
  if(r<=0||!sh.cn.some(Boolean)){ c.rect(x,y,W,H); return; }
  const P=[[x,y],[x+W,y],[x+W,y+H],[x,y+H]];            // 좌상, 우상, 우하, 좌하
  const D=[[1,0],[0,1],[-1,0],[0,-1]];                    // 변 i의 진행 방향 (꼭짓점 i → i+1)
  c.moveTo(x+W/2,y);
  for(const i of [1,2,3,0]){
    const [px,py]=P[i], din=D[(i+3)%4], dout=D[i], ri=sh.cn[i]?r:0;
    if(!ri){ c.lineTo(px,py); continue; }
    const ax=px-din[0]*ri, ay=py-din[1]*ri, bx=px+dout[0]*ri, by=py+dout[1]*ri;
    c.lineTo(ax,ay);
    if(sh.style==="cut") c.lineTo(bx,by);
    else if(sh.style==="notch") c.arc(px,py,ri,Math.atan2(-din[1],-din[0]),Math.atan2(dout[1],dout[0]),true);
    else c.arcTo(px,py,bx,by,ri);
  }
  c.closePath();
}
// 바깥쪽 옅은 선(안쪽 선보다 inset만큼 큼)에 쓸 모서리 크기 보정
function outerShape(sh,inset){
  const k=sh.style==="round"?1:sh.style==="cut"?.586:0;
  return {...sh,size:sh.size+inset*k};
}
// 블러 반경(px). 가장자리가 투명하게 번지지 않도록 그릴 때 이미지를 이만큼 키워서 번진 가장자리를 틀 밖으로 보냄
function blurPx(w,h){ return $("filterType").value==="blur" ? 8*(+$("filterAmt").value/100)*Math.max(w,h)/800 : 0; }
// 이미지 필터 프리셋 (강도 0~100%)
function filterStr(w,h){
  const t=$("filterType").value, k=+$("filterAmt").value/100, u=Math.max(w,h)/800;
  switch(t){
    case "gray":    return `grayscale(${k})`;
    case "sepia":   return `sepia(${k})`;
    case "vintage": return `sepia(${.55*k}) contrast(${1+.12*k}) saturate(${1-.2*k}) brightness(${1-.04*k})`;
    case "vivid":   return `saturate(${1+k}) contrast(${1+.2*k})`;
    case "fade":    return `contrast(${1-.3*k}) brightness(${1+.12*k}) saturate(${1-.25*k})`;
    case "noir":    return `grayscale(${k}) contrast(${1+.5*k}) brightness(${1-.1*k})`;
    case "blur":    return `blur(${blurPx(w,h).toFixed(2)}px)`;
    case "invert":  return `invert(${k})`;
    case "hue":     return `hue-rotate(${180*k}deg)`;
    default:        return "";
  }
}

// 액자 외곽선. fixed: 여백 위치에 고정 / follow: 이미지와 함께 이동 / wrap: 고정된 액자 안에서 이미지가 보이는 부분만 둘러쌈
function drawFrameLines(o){
  const {w,h,margin,innerW,innerH,shape,style,mode,ox,oy,rot,dw,dh}=o;
  const inset=Math.min(10,margin*.15);
  const lines=[[0,"rgba(0,0,0,.14)"]];
  if(style!=="round") lines.push([inset,"rgba(0,0,0,.08)"]);   // 바깥쪽 옅은 선은 톱니/컷 계열 스타일에서만
  for(const [g,color] of lines){
    const sh=g?outerShape(shape,g):shape;
    ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=1;
    if(mode==="follow"){
      ctx.translate(w/2+ox,h/2+oy); ctx.rotate(rot);
      framePath(ctx,-innerW/2-g+.5,-innerH/2-g+.5,innerW+2*g-1,innerH+2*g-1,sh); ctx.stroke();
    } else if(mode==="wrap"){
      const V=visiblePoly({w,h,margin,innerW,innerH,ox,oy,rot,dw,dh,fixed:true},g-.5);
      if(V.length>=3){ polyPath(ctx,V,sh); ctx.stroke(); }
    } else {
      framePath(ctx,margin-g+.5,margin-g+.5,w-2*(margin-g)-1,h-2*(margin-g)-1,sh); ctx.stroke();
    }
    ctx.restore();
  }
}

// ---- 보이는 이미지 영역(이미지 ∩ 액자 창)의 다각형과, 그 모서리를 깎은 경로 ----
function clipPoly(subj,clip){                      // Sutherland–Hodgman (두 다각형 모두 시계 방향)
  let out=subj;
  for(let i=0;i<clip.length&&out.length;i++){
    const a=clip[i], b=clip[(i+1)%clip.length], inp=out; out=[];
    const side=p=>(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);
    for(let j=0;j<inp.length;j++){
      const P=inp[j], Q=inp[(j+1)%inp.length], sp=side(P), sq=side(Q);
      if(sp>=0) out.push(P);
      if((sp>=0)!==(sq>=0)){ const t=sp/(sp-sq); out.push([P[0]+(Q[0]-P[0])*t,P[1]+(Q[1]-P[1])*t]); }
    }
  }
  return out;
}
function cleanPoly(pts){                           // 거의 같은 점·일직선 위의 점 제거 (모서리 반경이 불필요하게 줄어드는 것 방지)
  const near=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1])<=0.6;
  let p=[]; for(const q of pts){ if(!p.length||!near(q,p[p.length-1])) p.push(q); }
  if(p.length>1&&near(p[0],p[p.length-1])) p.pop();
  for(let again=true;again&&p.length>3;){
    again=false;
    for(let i=0;i<p.length;i++){
      const a=p[(i+p.length-1)%p.length], b=p[i], c=p[(i+1)%p.length];
      const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
      const l=Math.hypot(b[0]-a[0],b[1]-a[1])*Math.hypot(c[0]-b[0],c[1]-b[1]);
      if(l>0&&Math.abs(cr)/l<0.01){ p.splice(i,1); again=true; break; }
    }
  }
  return p;
}
// g: 이미지 위치·크기, e: 바깥(+)/안쪽(-)으로 넓힌 정도. g.fixed면 액자 창이 고정(액자 안에서만), 아니면 이미지와 함께 이동
function visiblePoly(g,e){
  const cx=g.w/2+g.ox, cy=g.h/2+g.oy, c=Math.cos(g.rot), s=Math.sin(g.rot);
  const rotRect=(hw,hh)=>[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([x,y])=>[cx+x*c-y*s,cy+x*s+y*c]);
  const img=rotRect(g.dw/2+e,g.dh/2+e);
  const win=g.fixed
    ? [[g.margin-e,g.margin-e],[g.w-g.margin+e,g.margin-e],[g.w-g.margin+e,g.h-g.margin+e],[g.margin-e,g.h-g.margin+e]]
    : rotRect(g.innerW/2+e,g.innerH/2+e);
  return cleanPoly(clipPoly(img,win));
}
function polyPath(c,pts,sh){
  c.beginPath();
  const n=pts.length; if(n<3) return;
  let area=0; for(let i=0;i<n;i++){ const a=pts[i], b=pts[(i+1)%n]; area+=a[0]*b[1]-b[0]*a[1]; }
  const P=area<0?pts.slice().reverse():pts;        // 시계 방향으로 통일
  if(sh.size<=0||!sh.cn.some(Boolean)){ c.moveTo(P[0][0],P[0][1]); for(let i=1;i<n;i++) c.lineTo(P[i][0],P[i][1]); c.closePath(); return; }
  const mx=P.reduce((t,q)=>t+q[0],0)/n, my=P.reduce((t,q)=>t+q[1],0)/n;
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const m0=mid(P[n-1],P[0]); c.moveTo(m0[0],m0[1]);
  for(let i=0;i<n;i++){
    const v=P[i], pr=P[(i+n-1)%n], nx=P[(i+1)%n], mn=mid(v,nx);
    const on=sh.cn[v[0]<mx?(v[1]<my?0:3):(v[1]<my?1:2)];          // 좌상·우상·우하·좌하 중 어느 모서리인지
    if(!on){ c.lineTo(v[0],v[1]); c.lineTo(mn[0],mn[1]); continue; }
    const lp=Math.hypot(pr[0]-v[0],pr[1]-v[1]), ln=Math.hypot(nx[0]-v[0],nx[1]-v[1]);
    const up=[(pr[0]-v[0])/lp,(pr[1]-v[1])/lp], un=[(nx[0]-v[0])/ln,(nx[1]-v[1])/ln];
    const th=Math.acos(Math.max(-1,Math.min(1,up[0]*un[0]+up[1]*un[1])));   // 꼭짓점의 내각
    const half=Math.min(lp,ln)/2;
    if(sh.style==="cut"){
      const d=Math.min(sh.size,half);
      c.lineTo(v[0]+up[0]*d,v[1]+up[1]*d); c.lineTo(v[0]+un[0]*d,v[1]+un[1]*d);
    } else if(sh.style==="notch"){
      const d=Math.min(sh.size,half);
      c.lineTo(v[0]+up[0]*d,v[1]+up[1]*d);
      c.arc(v[0],v[1],d,Math.atan2(up[1],up[0]),Math.atan2(un[1],un[0]),true);
    } else {
      c.arcTo(v[0],v[1],mn[0],mn[1],Math.min(sh.size,half*Math.tan(th/2)));
    }
    c.lineTo(mn[0],mn[1]);
  }
  c.closePath();
}

let texImg=null;
let textureCacheLayer=null;
let textureCacheKey="";
let customPatternCache=null;
let customPatternKey="";
let customCompositeCache=null;

function clearTextureCache(){
  textureCacheLayer=null;
  textureCacheKey="";
  customPatternCache=null;
  customPatternKey="";
  customCompositeCache=null;
}

// 불러온 텍스처를 반복/채우기 방식으로 만든 원본 패턴만 캐시합니다.
// 실제 캔버스의 투명한 천공에는 렌더링할 때 source-atop으로만 합성합니다.
function getCustomPattern(w,h){
  if(!texImg) return null;
  const fit=$("texFit").value;
  const key=`${w}x${h}|${fit}|${texImg.src}`;
  if(customPatternCache && customPatternKey===key) return customPatternCache;
  const off=document.createElement("canvas"); off.width=w; off.height=h;
  const o=off.getContext("2d");
  if(fit==="tile"){
    o.fillStyle=o.createPattern(texImg,"repeat"); o.fillRect(0,0,w,h);
  } else {
    const iw=texImg.naturalWidth, ih=texImg.naturalHeight, f=Math.max(w/iw,h/ih);
    o.drawImage(texImg,(w-iw*f)/2,(h-ih*f)/2,iw*f,ih*f);
  }
  customPatternCache=off; customPatternKey=key;
  return off;
}

function paperCustom(amount, w, h){
  const pattern=getCustomPattern(w,h);
  if(!pattern) return;
  if(!customCompositeCache || customCompositeCache.width!==w || customCompositeCache.height!==h){
    customCompositeCache=document.createElement("canvas");
    customCompositeCache.width=w; customCompositeCache.height=h;
  }
  const m=customCompositeCache.getContext("2d");
  m.clearRect(0,0,w,h);
  m.drawImage(pattern,0,0);
  m.globalCompositeOperation="destination-in";
  m.drawImage(canvas,0,0);
  ctx.save();
  ctx.globalCompositeOperation=$("texBlend").value;
  ctx.globalAlpha=Math.min(1,amount/100);
  ctx.drawImage(customCompositeCache,0,0);
  ctx.restore();
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function makeTextureLayer(tex,w,h){
  const key=`${tex}|${w}x${h}`;
  if(textureCacheLayer && textureCacheKey===key) return textureCacheLayer;
  const off=document.createElement("canvas"); off.width=w; off.height=h;
  const c=off.getContext("2d");
  const r=mulberry32(20260101 ^ w ^ (h<<1));
  const u=Math.max(1,Math.max(w,h)/800);
  const st=Math.max(2,Math.round(3*u)), lw=Math.max(1,Math.round(u));
  c.clearRect(0,0,w,h);
  if(tex==="fiber"){
    const n=Math.floor(w*h*0.0012);
    c.lineWidth=Math.max(.5,.7*u);
    for(let i=0;i<n;i++){
      const x=r()*w,y=r()*h,a=r()*Math.PI*2,l=(6+r()*18)*u,b=(r()-.5)*l*.6;
      c.strokeStyle=r()>.5?"rgba(70,55,40,.16)":"rgba(255,255,255,.22)";
      c.beginPath();c.moveTo(x,y);
      c.quadraticCurveTo(x+Math.cos(a)*l/2-Math.sin(a)*b,y+Math.sin(a)*l/2+Math.cos(a)*b,x+Math.cos(a)*l,y+Math.sin(a)*l);
      c.stroke();
    }
  } else if(tex==="laid"){
    const a=.12;
    for(let y=0;y<h;y+=st){c.fillStyle=`rgba(0,0,0,${a*(.4+r()*.6)})`;c.fillRect(0,y,w,lw);}
    for(let x=0;x<w;x+=st*12){c.fillStyle=`rgba(255,255,255,${a*1.2})`;c.fillRect(x,0,lw,h);}
  } else if(tex==="canvas"){
    const a=.15;
    for(let y=0;y<h;y+=st){c.fillStyle=`rgba(0,0,0,${a*(.5+r()*.5)})`;c.fillRect(0,y,w,lw);}
    for(let x=0;x<w;x+=st){c.fillStyle=`rgba(0,0,0,${a*(.5+r()*.5)})`;c.fillRect(x,0,lw,h);}
  } else if(tex==="stain"){
    const n=30;
    for(let i=0;i<n;i++){
      const x=r()*w,y=r()*h,rad=(25+r()*110)*u;
      const g=c.createRadialGradient(x,y,0,x,y,rad);
      g.addColorStop(0,"rgba(130,95,40,.12)");
      g.addColorStop(1,"rgba(130,95,40,0)");
      c.fillStyle=g;c.fillRect(x-rad,y-rad,rad*2,rad*2);
    }
  } else if(tex==="grain"){
    // 매 렌더마다 getImageData/putImageData를 하지 않고 노이즈 오버레이 자체를 캐시합니다.
    const id=c.createImageData(w,h),d=id.data;
    for(let i=0;i<d.length;i+=4){
      const v=r()>.5;
      d[i]=v?255:0; d[i+1]=v?255:0; d[i+2]=v?255:0;
      d[i+3]=Math.round(22*r());
    }
    c.putImageData(id,0,0);
  } else if(tex==="dot"){
    const n=Math.floor(w*h*0.003);
    c.save(); c.globalAlpha=.10;
    for(let i=0;i<n;i++){
      const x=r()*w,y=r()*h,a=15+r()*35;
      c.fillStyle=r()>.5?`rgb(${a},${a},${a})`:`rgb(${220+a},${220+a},${220+a})`;
      c.fillRect(x,y,r()*1.4+.3,r()*1.4+.3);
    }
    c.restore();
  }
  textureCacheLayer=off; textureCacheKey=key;
  return off;
}

function paperTexture(tex, amount, w, h){
  if(amount<=0) return;
  const layer=makeTextureLayer(tex,w,h);
  ctx.save();
  ctx.globalCompositeOperation=tex==="grain"?"source-atop":"source-atop";
  ctx.globalAlpha=Math.min(1,amount/100);
  ctx.drawImage(layer,0,0);
  ctx.restore();
}

function paperNoise(amount, w, h){
  if(amount <= 0) return;
  const tex=$("textureStyle").value;
  if(tex==="none") return;
  if(tex==="custom"){ paperCustom(amount,w,h); return; }
  paperTexture(tex,amount,w,h);
}

const STICKER_MAX=5;
let stickers=[], stickerCur=-1, stickerHist=[], stickerCommitted=[];
const stickerDefault=()=>({name:"스티커",src:"",visible:true,scale:100,rot:0,alpha:100,x:0,y:0,border:0,borderColor:"#ffffff"});
function readSticker(){
  if(stickerCur<0) return null;
  return {visible:$('stickerVisible').checked,scale:+$('stickerScale').value,rot:+$('stickerRot').value,alpha:+$('stickerAlpha').value,x:+$('stickerX').value,y:+$('stickerY').value,border:+$('stickerBorder').value,borderColor:$('stickerBorderColor').value};
}
function writeSticker(st){
  if(!st) return;
  $('stickerVisible').checked=!!st.visible;
  const set=(id,v,lab,suf)=>{$(id).value=v;setText(lab,`${v}${suf}`)};
  set('stickerScale',st.scale,'stickerScaleVal','%');set('stickerRot',st.rot,'stickerRotVal','°');set('stickerAlpha',st.alpha,'stickerAlphaVal','%');set('stickerX',st.x,'stickerXVal','%');set('stickerY',st.y,'stickerYVal','%');set('stickerBorder',st.border,'stickerBorderVal',' px');$('stickerBorderColor').value=st.borderColor||'#ffffff';
}
function stickerSnapshot(){return stickerCur<0?null:{...stickers[stickerCur],...readSticker()};}
function stickerCommit(){
  if(stickerCur<0)return;
  const cur=stickerSnapshot(), prev=stickerCommitted[stickerCur];
  if(!prev||JSON.stringify(cur)!==JSON.stringify(prev)){stickerHist[stickerCur]=stickerHist[stickerCur]||[];stickerHist[stickerCur].push({...prev});if(stickerHist[stickerCur].length>50)stickerHist[stickerCur].shift();stickerCommitted[stickerCur]={...cur};renderStickerTabs();}
}
function selectSticker(i){if(stickerCur>=0){stickers[stickerCur]={...stickers[stickerCur],...readSticker()};stickerCommit()}stickerCur=i;writeSticker(stickers[i]);renderStickerTabs();draw()}
function renderStickerTabs(){
  const box=$('stickerTabs');box.innerHTML='';
  stickers.forEach((st,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=st.name||`스티커 ${i+1}`;if(i===stickerCur)b.classList.add('active');b.onclick=()=>selectSticker(i);box.appendChild(b)});
  const hint=document.createElement('span');hint.className='muted';hint.style.marginLeft='4px';hint.textContent=stickers.length?`(${stickers.length}/${STICKER_MAX})`:'';box.appendChild(hint);
  $('stickerControls').classList.toggle('hidden',stickerCur<0);if(stickerCur>=0){const h=stickerHist[stickerCur]||[];$('stickerUndo').disabled=!h.length;}
}
function addStickerFile(file){
  if(stickers.length>=STICKER_MAX||!file||!file.type.startsWith('image/'))return;
  const reader=new FileReader();reader.onload=e=>{const im=new Image();im.onload=()=>{const st={...stickerDefault(),name:file.name,src:e.target.result,img:im};const k=Math.min(1,420/Math.max(im.naturalWidth,im.naturalHeight));st.baseW=im.naturalWidth*k;st.baseH=im.naturalHeight*k;stickers.push(st);stickerHist.push([]);stickerCommitted.push({...st});stickerCur=stickers.length-1;writeSticker(st);renderStickerTabs();draw()};im.src=e.target.result};reader.readAsDataURL(file);
}
$('stickerDrop').onclick=()=>$('stickerFile').click();
$('stickerFile').onchange=e=>{[...e.target.files].forEach(addStickerFile);e.target.value=''};
$('stickerDrop').ondragover=e=>{e.preventDefault();$('stickerDrop').style.borderColor='#b99b61'};
$('stickerDrop').ondragleave=()=>$('stickerDrop').style.borderColor='';
$('stickerDrop').ondrop=e=>{e.preventDefault();$('stickerDrop').style.borderColor='';[...e.dataTransfer.files].forEach(addStickerFile)};
function undoSticker(){if(stickerCur<0)return;const h=stickerHist[stickerCur];if(!h?.length)return;stickers[stickerCur]={...h.pop()};writeSticker(stickers[stickerCur]);stickerCommitted[stickerCur]={...stickers[stickerCur]};renderStickerTabs();draw()}
function resetSticker(){if(stickerCur<0)return;stickerCommit();stickerHist[stickerCur].push({...stickers[stickerCur]});const keep={...stickers[stickerCur]};stickers[stickerCur]={...stickerDefault(),name:keep.name,src:keep.src,img:keep.img,baseW:keep.baseW,baseH:keep.baseH};writeSticker(stickers[stickerCur]);stickerCommitted[stickerCur]={...stickers[stickerCur]};renderStickerTabs();draw()}
$('stickerUndo').onclick=undoSticker;$('stickerReset').onclick=resetSticker;$('stickerCenter').onclick=()=>{if(stickerCur<0)return;stickers[stickerCur].x=0;stickers[stickerCur].y=0;writeSticker(stickers[stickerCur]);draw();stickerCommit()};
$('stickerDelete').onclick=()=>{if(stickerCur<0)return;stickers.splice(stickerCur,1);stickerHist.splice(stickerCur,1);stickerCommitted.splice(stickerCur,1);stickerCur=Math.min(stickerCur,stickers.length-1);if(stickerCur>=0)writeSticker(stickers[stickerCur]);renderStickerTabs();draw()};
['stickerVisible','stickerScale','stickerRot','stickerAlpha','stickerX','stickerY','stickerBorder','stickerBorderColor'].forEach(id=>{$(id).addEventListener('input',()=>{if(stickerCur<0)return;stickers[stickerCur]={...stickers[stickerCur],...readSticker()};setText('stickerScaleVal',`${$('stickerScale').value}%`);setText('stickerRotVal',`${$('stickerRot').value}°`);setText('stickerAlphaVal',`${$('stickerAlpha').value}%`);setText('stickerXVal',`${$('stickerX').value}%`);setText('stickerYVal',`${$('stickerY').value}%`);setText('stickerBorderVal',`${$('stickerBorder').value} px`);draw()});$(id).addEventListener('change',stickerCommit)});
function drawSticker(st,w,h){
  if(!st.visible||!st.img)return;
  const bw=st.baseW*st.scale/100,bh=st.baseH*st.scale/100,cx=w/2+st.x/100*w,cy=h/2+st.y/100*h,r=st.rot*Math.PI/180,b=st.border;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(r);ctx.globalAlpha=st.alpha/100;
  if(b>0){ctx.save();ctx.shadowColor='rgba(0,0,0,.16)';ctx.shadowBlur=Math.max(2,b*.6);ctx.fillStyle=st.borderColor||'#fff';ctx.beginPath();ctx.roundRect(-bw/2-b,-bh/2-b,bw+2*b,bh+2*b,Math.min(18,b));ctx.fill();ctx.restore()}
  ctx.drawImage(st.img,-bw/2,-bh/2,bw,bh);ctx.restore();
}

function stickerHit(st,x,y,w,h){
  if(!st.visible||!st.img)return false;
  const cx=w/2+st.x/100*w,cy=h/2+st.y/100*h,a=-st.rot*Math.PI/180,dx=x-cx,dy=y-cy;
  const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
  const bw=st.baseW*st.scale/100/2+st.border,bh=st.baseH*st.scale/100/2+st.border;
  return Math.abs(lx)<=bw&&Math.abs(ly)<=bh;
}

function render(){
  const w=canvas.width,h=canvas.height;
  syncPos(w,h);
  scheduleSave();
  const paper=$("paperColor").value;
  const border=$("borderColor").value;
  const margin=+$("margin").value;
  const style=$("borderStyle").value;
  const texture=+$("texture").value;
  const shape=getShape();

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=paper;
  const gm=$("gradMode").value;
  if(gm!=="none"){
    // 각도: CSS와 같은 방식 (0°=위쪽, 90°=오른쪽, 180°=아래쪽). 캔버스 전체를 덮도록 중심 기준으로 선을 계산
    const th=(+$("gradAngle").value)*Math.PI/180, dx=Math.sin(th), dy=-Math.cos(th), L=Math.abs(w*dx)+Math.abs(h*dy);
    const g=ctx.createLinearGradient(w/2-dx*L/2,h/2-dy*L/2,w/2+dx*L/2,h/2+dy*L/2);
    const cols=[paper,$("paperColor2").value,...gradExtra];
    cols.forEach((c,i)=>g.addColorStop(i/(cols.length-1),c));
    ctx.fillStyle=g;
  }
  ctx.fillRect(0,0,w,h);

  if(img){
    const iw=img.naturalWidth, ih=img.naturalHeight;
    const innerW=Math.max(1,w-margin*2), innerH=Math.max(1,h-margin*2);
    const fit=Math.max(innerW/iw, innerH/ih); // 항상 영역을 꽉 채우되, 이미지가 자동 비율 유지
    const s=fit*scale;

    const fixedFrame=$("limitMove").checked;
    const s2=s*(1+3*blurPx(w,h)/Math.max(1,Math.min(iw*s,ih*s)));
    // 모서리 모양은 액자 창이 아니라 "실제로 보이는 이미지 영역"(이미지 ∩ 액자 창)의 모서리에 적용
    const V=visiblePoly({w,h,margin,innerW,innerH,ox:offsetX,oy:offsetY,rot:rotation*Math.PI/180,dw:iw*s2,dh:ih*s2,fixed:fixedFrame},0);
    ctx.save();
    if(V.length>=3){
      polyPath(ctx,V,shape); ctx.clip();
      ctx.translate(w/2+offsetX,h/2+offsetY);
      ctx.rotate(rotation*Math.PI/180);
      ctx.filter=`brightness(${brightness}) ${filterStr(w,h)}`;
      ctx.drawImage(img,-iw*s2/2,-ih*s2/2,iw*s2,ih*s2);
    }
    ctx.restore();
    ctx.filter="none";

    // 액자 외곽선(안쪽 얇은 선 + 바깥 옅은 선). 모드: fixed(고정) / follow(액자도 이동) / wrap(액자 안에서만 + 액자 유지)
    if(style!=="none" && $("frame").checked){
      const lineMode=fixedFrame ? ($("frameWrap").checked?"wrap":"fixed") : ($("frameFollow").checked?"follow":"fixed");
      drawFrameLines({w,h,margin,innerW,innerH,shape,style,mode:lineMode,ox:offsetX,oy:offsetY,rot:rotation*Math.PI/180,dw:iw*s2,dh:ih*s2});
    }

    // 스티커는 이미지 액자 외곽선보다 위에 올라오고, 우표 바깥 천공에는 아래에서 잘립니다.
    for(const st of stickers) drawSticker(st,w,h);
  }

  if(style!=="round" && style!=="none"){
    const pk = +$("perf").value/100;
    const step = (style==="classic" ? 18 : 25) * Math.max(1,pk);
    if(style==="classic"||style==="clean") drawPerforatedRect(0,0,w,h,border,step,5.2*pk);
    else drawEdgeStyle(style,w,h,pk);
  } else if(style==="round"){
    const sides=getBorderSides();
    ctx.save();
    const R=Math.min(+$("edgeCut").value,w/2,h/2), lw=EDGE_LW, rc=Math.max(0,R-lw/2);
    ctx.strokeStyle=border;ctx.lineWidth=lw;ctx.lineCap="round";
    if(sides.top){ctx.beginPath();ctx.moveTo(lw/2+rc,lw/2);ctx.lineTo(w-lw/2-rc,lw/2);ctx.stroke();}
    if(sides.right){ctx.beginPath();ctx.moveTo(w-lw/2,lw/2+rc);ctx.lineTo(w-lw/2,h-lw/2-rc);ctx.stroke();}
    if(sides.bottom){ctx.beginPath();ctx.moveTo(w-lw/2-rc,h-lw/2);ctx.lineTo(lw/2+rc,h-lw/2);ctx.stroke();}
    if(sides.left){ctx.beginPath();ctx.moveTo(lw/2,h-lw/2-rc);ctx.lineTo(lw/2,lw/2+rc);ctx.stroke();}
    ctx.restore();
  }

  captions[capCur]=readCap();
  for(let i=captions.length-1;i>=0;i--) drawCaption(captions[i],w,h); // 1번이 가장 위에 오도록 뒤 번호부터 그림

  paperNoise(texture,w,h);

  if(style==="round"){
    // 둥근 테두리 바깥(모서리 밖)은 그라데이션·질감 포함 전부 투명하게 잘라냄
    const rr=Math.min(+$("edgeCut").value,w/2,h/2);
    ctx.save();
    ctx.globalCompositeOperation="destination-in";
    ctx.beginPath();ctx.roundRect(0,0,w,h,rr);
    ctx.fillStyle="#000";ctx.fill();
    ctx.restore();
  }

  if(!img){
    ctx.fillStyle="#777";ctx.font="16px system-ui,sans-serif";ctx.textAlign="center";
    ctx.fillText("이미지를 불러오세요",w/2,h/2);
  }
}

  const fam=`UserFont${n}`;

  await face.load();
  document.fonts.add(face); userFaces.push(face);
  CAPTION_FONTS["user"+n]=`"${fam}", sans-serif`;
  const o=document.createElement("option");
  o.value="user"+n; o.textContent=name.replace(/\.[^.]+$/,"");
  const sel=$("captionFont");
  sel.insertBefore(o,sel.querySelector('option[value="__load"]'));
}
$("fontFile").onchange=async e=>{
  const f=e.target.files[0]; e.target.value="";
  if(!f) return;
  try{
    const buf=await f.arrayBuffer(), n=++userFontN;
    await addUserFont(buf,f.name,n);
    $("captionFont").value=prevFont="user"+n;
    draw();
    dbPut({id:"font:"+n,kind:"font",n,name:f.name,data:buf});
  }catch(err){ alert("폰트를 불러오지 못했어요: "+f.name); }
};
$("edgeCut").oninput=e=>{setText("edgeCutVal",`${e.target.value}px`);draw()};
$("cornerSize").oninput=e=>{setText("cornerSizeVal",`${e.target.value} px`);draw()};
$("filterAmt").oninput=e=>{setText("filterAmtVal",`${e.target.value}%`);draw()};
let gradExtra=[]; // 세 번째 이후 그라데이션 색 (최대 3개 → 총 5색)
function renderGradChips(){
  const box=$("gxChips"); box.innerHTML="";
  gradExtra.forEach((c,i)=>{
    const el=document.createElement("input"); el.type="color"; el.className="chip"; el.value=c; el.title=`${i+3}번째 색`;

    box.appendChild(el);
  });

}
$("gxAdd").onclick=()=>{ if(gradExtra.length>=3) return; gradExtra.push(gradExtra.length?gradExtra[gradExtra.length-1]:$("paperColor2").value); renderGradChips(); draw(); };
$("gxDel").onclick=()=>{ gradExtra.pop(); renderGradChips(); draw(); };
$("gradAngle").oninput=e=>{setText("gradAngleVal",`${e.target.value}°`);draw()};
function syncFrameOpts(){ const a=$("limitMove").checked; $("frameWrap").disabled=!a; $("frameFollow").disabled=a; }
$("limitMove").addEventListener("input",syncFrameOpts);
$("capRot").oninput=e=>{setText("capRotVal",`${e.target.value}°`);draw()};
$("capAlpha").oninput=e=>{setText("capAlphaVal",`${e.target.value}%`);draw()};
$("capSpacing").oninput=e=>{setText("capSpacingVal",`${e.target.value} px`);draw()};
$("capScaleX").oninput=e=>{setText("capScaleXVal",`${e.target.value}%`);draw()};
$("capScaleY").oninput=e=>{setText("capScaleYVal",`${e.target.value}%`);draw()};

["borderStyle","borderColor","borderTop","borderBottom","borderLeft","borderRight","paperColor","caption","frame","gradMode","paperColor2","textureStyle","texFit","texBlend","captionFont","captionColor","captionOutlineColor","limitMove","filterType","cornerStyle","cnTL","cnTR","cnBL","cnBR","capBold","capItalic","frameWrap","frameFollow","capBlend"].forEach(id=>$(id).addEventListener("input",draw));

function setTheme(m){
  document.documentElement.dataset.theme=m;
  $("themeBtn").textContent=m==="light"?"☀ 라이트":"🌙 다크";
}
$("themeBtn").onclick=()=>{
  setTheme(document.documentElement.dataset.theme==="light"?"dark":"light");
  scheduleSave();
};

$("textureStyle").addEventListener("input",()=>$("texCustom").classList.toggle("hidden",$("textureStyle").value!=="custom"));
$("gradMode").addEventListener("input",()=>{
  const on=$("gradMode").value!=="none";
  $("paperColor2").classList.toggle("hidden",!on); $("gradMore").classList.toggle("hidden",!on);
});
$("borderStyle").addEventListener("input",()=>{
  const v=$("borderStyle").value;
  $("borderColorField").classList.toggle("hidden",v!=="round");
  $("edgeCutField").classList.toggle("hidden",v!=="round"&&v!=="bevel");
});
$("texBtn").onclick=()=>$("texFile").click();
const TEX_HINT='강도는 위의 "종이 질감" 슬라이더로 조절해요';
function setTexture(blob,name){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{texImg=im;clearTextureCache();$("texName").textContent=`${name} · ${im.naturalWidth} × ${im.naturalHeight}px`;draw();res(true)};
    im.onerror=()=>res(false);
    im.src=URL.createObjectURL(blob);
  });
}
$("texFile").onchange=async e=>{
  const f=e.target.files[0];
  if(!f||!f.type.startsWith("image/"))return;
  if(await setTexture(f,f.name)) dbPut({id:"texture",kind:"texture",name:f.name,data:f});
};

// ---- 이미지 가로/세로 이동 (드래그와 슬라이더가 서로 동기화) ----
function syncPos(w,h){
  const px=Math.round(offsetX/w*1000)/10, py=Math.round(offsetY/h*1000)/10;
  $("imgX").value=px; $("imgY").value=py;
  setText("imgXVal",`${px}%`); setText("imgYVal",`${py}%`);
}
$("imgX").oninput=e=>{offsetX=+e.target.value/100*canvas.width;draw()};
$("imgY").oninput=e=>{offsetY=+e.target.value/100*canvas.height;draw()};

// ---- 이미지 조정 되돌리기 / 초기화 ----
let hist=[], committed={scale:1,rotation:0,brightness:1,offsetX:0,offsetY:0};
const adjKeys=()=>({scale,rotation,brightness,offsetX,offsetY});
function updateUndo(){ $("undoBtn").disabled=!hist.length; }
function commit(){
  const cur=adjKeys();
  if(JSON.stringify(cur)===JSON.stringify(committed)) return;
  hist.push(committed); if(hist.length>50) hist.shift();
  committed=cur; updateUndo();
}
function applyAdj(a){
  ({scale,rotation,brightness,offsetX,offsetY}=a);
  $("scale").value=Math.round(scale*100); setText("scaleVal",`${Math.round(scale*100)}%`);
  $("rotation").value=rotation; setText("rotationVal",`${rotation}°`);
  $("brightness").value=Math.round(brightness*100); setText("brightnessVal",`${Math.round(brightness*100)}%`);
  draw();
}
["scale","rotation","brightness","imgX","imgY"].forEach(id=>$(id).addEventListener("change",commit));
$("undoBtn").onclick=()=>{ if(!hist.length) return; const a=hist.pop(); committed=a; applyAdj(a); updateUndo(); };
$("adjResetBtn").onclick=()=>{ applyAdj({scale:1,rotation:0,brightness:1,offsetX:0,offsetY:0}); commit(); };
$("centerBtn").onclick=()=>{offsetX=0;offsetY=0;draw();commit()};

$("resetBtn").onclick=()=>{
  img=null;offsetX=offsetY=0;scale=1;rotation=0;brightness=1;
  $("file").value="";$("fileName").textContent="";captions=[{...capDefault()}];capCur=0;capHist=[[]];capCommitted=[{...captions[0]}];writeCap(captions[0]);renderTabs();stickers=[];stickerCur=-1;stickerHist=[];stickerCommitted=[];renderStickerTabs();
  canvas.width=800;canvas.height=533;syncOut();hist=[];committed=adjKeys();updateUndo();
  $("scale").value=100;$("rotation").value=0;$("brightness").value=100;
  clearTextureCache();
  draw();
};

$("saveBtn").onclick=()=>{
  const W=Math.round(+$("outW").value), H=Math.round(+$("outH").value);
  render();
  let src=canvas;
  if(W>0&&H>0&&(W!==canvas.width||H!==canvas.height)){
    src=document.createElement("canvas"); src.width=W; src.height=H;
    const c=src.getContext("2d"); c.imageSmoothingEnabled=true; c.imageSmoothingQuality="high";
    c.drawImage(canvas,0,0,W,H);
  }
  const a=document.createElement("a");
  if(src===canvas) render();
  a.download="stamp.png";
  a.href=src.toDataURL("image/png");
  a.click();
};
// 저장 크기: 한쪽을 입력하면 현재 캔버스 비율에 맞춰 다른 쪽을 자동 계산 (한 변 최대 8000px)
function setOut(wv,hv){ const k=Math.min(1,8000/Math.max(wv,hv)); $("outW").value=Math.round(wv*k); $("outH").value=Math.round(hv*k); }
$("outW").oninput=()=>{const v=+$("outW").value;if(v>0){const hh=v*canvas.height/canvas.width;if(Math.max(v,hh)>8000)setOut(v,hh);else $("outH").value=Math.round(hh);}};
$("outH").oninput=()=>{const v=+$("outH").value;if(v>0){const ww=v*canvas.width/canvas.height;if(Math.max(v,ww)>8000)setOut(ww,v);else $("outW").value=Math.round(ww);}};
window.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();$("saveBtn").click()}
});

let drag=null,stickerDrag=null;
canvas.addEventListener("pointerdown",e=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;
  // 선택된 스티커가 있다면 그 위에서 바로 드래그할 수 있고, 겹쳐 있다면 위쪽 스티커부터 잡습니다.
  for(let i=stickers.length-1;i>=0;i--){
    if(stickerHit(stickers[i],x,y,canvas.width,canvas.height)){
      if(stickerCur!==i)selectSticker(i);
      stickerDrag={x,y,sx:stickers[i].x,sy:stickers[i].y};
      canvas.setPointerCapture(e.pointerId); return;
    }
  }
  if(!img)return;
  drag={x,y,ox:offsetX,oy:offsetY}; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;
  if(stickerDrag&&stickerCur>=0){
    const st=stickers[stickerCur];
    st.x=stickerDrag.sx+(x-stickerDrag.x)/canvas.width*100;
    st.y=stickerDrag.sy+(y-stickerDrag.y)/canvas.height*100;
    const px=Math.round(st.x*10)/10, py=Math.round(st.y*10)/10;
    $("stickerX").value=px; $("stickerY").value=py;
    setText("stickerXVal",`${px}%`); setText("stickerYVal",`${py}%`);
    draw(); return;
  }
  if(!drag)return; offsetX=drag.ox+(x-drag.x);offsetY=drag.oy+(y-drag.y);draw();
});
canvas.addEventListener("pointerup",()=>{if(stickerDrag){stickerDrag=null;stickerCommit()}if(drag){drag=null;commit()}});
canvas.addEventListener("pointercancel",()=>{if(stickerDrag){stickerDrag=null;stickerCommit()}if(drag){drag=null;commit()}});

// 새 안내 투어는 처음 사용할 때 한 번 자동으로 보여 줍니다. 이후에는 상단 "사용 안내" 버튼으로 다시 열 수 있습니다.
const GUIDE_KEY="stampAtelier.guideSeen.v2";
window.addEventListener("load",()=>{
  try{ if(!localStorage.getItem(GUIDE_KEY)){ localStorage.setItem(GUIDE_KEY,"1"); guideOpen(); } }catch(e){}
});

// ---- 설정 저장(localStorage) / 설정 초기화 ----
// 이미지·불러온 폰트/텍스처 파일은 저장하지 않고, 이미지에 종속된 값(확대·회전·이동)도 저장하지 않음.
const SETTINGS_KEY="stampAtelier.settings.v1";
const SKIP_IDS=new Set(["scale","rotation","imgX","imgY","caption","captionFont","captionColor","fontSize","capBold","capItalic","capSpacing","capScaleX","capScaleY","captionX","captionY","captionOutline","captionOutlineColor","capRot","capAlpha","capBlend"]); // 문구 입력칸은 captions 배열로 따로 저장
const settingEls=()=>[...document.querySelectorAll("aside input, aside select")]
  .filter(el=>el.id && el.type!=="file" && !SKIP_IDS.has(el.id));
function collectSettings(){
  const o={theme:document.documentElement.dataset.theme==="light"?"light":"dark"};
  for(const el of settingEls()) o[el.id]=el.type==="checkbox"?el.checked:el.value;
  captions[capCur]=readCap(); o.captions=captions; o.capCur=capCur; o.gradExtra=[...gradExtra];
  return o;
}
// HTML에 적힌 기본값 (브라우저의 폼 값 복원과 무관하게 항상 같은 값)
function defaultSettings(){
  const o={theme:"dark"};
  for(const el of settingEls()){
    if(el.type==="checkbox") o[el.id]=el.defaultChecked;
    else if(el.tagName==="SELECT") o[el.id]=([...el.options].find(op=>op.defaultSelected)||el.options[0]).value;
    else o[el.id]=el.defaultValue;
  }
  o.captions=[capDefault()]; o.capCur=0; o.gradExtra=[];
  return o;
}
function applySettings(o){
  o={...o};
  if(o.gradMode==="h"){ o.gradMode="lin"; o.gradAngle=90; }        // 이전 버전: 좌→우
  else if(o.gradMode==="v"){ o.gradMode="lin"; o.gradAngle=180; }  // 이전 버전: 상→하
  for(const el of settingEls()){
    if(!(el.id in o)) continue;
    if(el.type==="checkbox") el.checked=!!o[el.id];
    else if(el.tagName==="SELECT"){
      if(![...el.options].some(op=>op.value===String(o[el.id]))) continue; // 불러온 폰트처럼 지금 없는 항목은 건너뜀
      el.value=o[el.id];
    } else el.value=o[el.id];
    el.dispatchEvent(new Event("input",{bubbles:true})); // 라벨·내부 값·표시/숨김을 기존 핸들러로 갱신
  }
  let caps=o.captions;
  if(!Array.isArray(caps) && "caption" in o){ // 문구가 1개뿐이던 이전 버전의 저장값
    caps=[{text:o.caption,font:o.captionFont,color:o.captionColor,size:+o.fontSize,x:+o.captionX,y:+o.captionY,outline:+o.captionOutline,outlineColor:o.captionOutlineColor}];
  }
  if(Array.isArray(caps) && caps.length){
    const clean=c=>Object.fromEntries(Object.entries(c||{}).filter(([k,v])=>v!==undefined&&v!==null&&!(typeof v==="number"&&isNaN(v))));
    captions=caps.slice(0,CAP_MAX).map(c=>({...capDefault(),...clean(c)}));
    capHist=captions.map(()=>[]); capCommitted=captions.map(c=>({...c}));
    capCur=Math.min(Math.max(+o.capCur||0,0),captions.length-1);
    writeCap(captions[capCur]); renderTabs();
  }
  if(Array.isArray(o.gradExtra)){ gradExtra=o.gradExtra.filter(c=>/^#[0-9a-f]{6}$/i.test(c)).slice(0,3); renderGradChips(); }
  syncFrameOpts();
  setTheme(o.theme==="light"?"light":"dark");
  prevFont=$("captionFont").value;
}
// 불러온 폰트/텍스처 파일은 용량이 커서 localStorage 대신 IndexedDB에 저장
function dbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("stampAtelier",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("assets",{keyPath:"id"});
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function dbPut(rec){
  try{ const db=await dbOpen();
    await new Promise((res,rej)=>{const tx=db.transaction("assets","readwrite");tx.objectStore("assets").put(rec);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
  }catch(e){}
}
async function dbAll(){
  try{ const db=await dbOpen();
    return await new Promise((res,rej)=>{const r=db.transaction("assets").objectStore("assets").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  }catch(e){ return []; }
}
async function dbClear(){
  try{ const db=await dbOpen();
    await new Promise((res,rej)=>{const tx=db.transaction("assets","readwrite");tx.objectStore("assets").clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
  }catch(e){}
}
async function restoreAssets(){
  const recs=(await dbAll()).sort((a,b)=>(a.n||0)-(b.n||0));
  for(const r of recs){
    try{
      if(r.kind==="font"){ userFontN=Math.max(userFontN,r.n); await addUserFont(r.data,r.name,r.n); }
      else if(r.kind==="texture"){ await setTexture(r.data,r.name); }
    }catch(e){}
  }
}
function clearAssets(){
  userFaces.forEach(f=>document.fonts.delete(f)); userFaces.length=0;
  $("captionFont").querySelectorAll('option[value^="user"]').forEach(o=>{delete CAPTION_FONTS[o.value];o.remove();});
  userFontN=0; texImg=null; $("texName").textContent=TEX_HINT;
  return dbClear();
}
let settingsReady=false, saveTimer=0;
function scheduleSave(){
  if(!settingsReady) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ try{ localStorage.setItem(SETTINGS_KEY,JSON.stringify(collectSettings())); }catch(e){} },300);
}
$("settingsResetBtn").onclick=()=>{
  if(!confirm("모든 설정을 기본값으로 되돌리고, 저장된 폰트·텍스처 파일도 지울까요?\n(불러온 이미지는 그대로 유지돼요)")) return;
  clearAssets();
  applySettings(defaultSettings());
  applyAdj({scale:1,rotation:0,brightness:1,offsetX:0,offsetY:0});
  hist=[]; committed=adjKeys(); updateUndo(); syncOut();
  try{ localStorage.removeItem(SETTINGS_KEY); }catch(e){}
};
// 브라우저의 폼 값 복원이 끝난 뒤에 저장된 설정을 적용
window.addEventListener("load",async()=>{
  await restoreAssets();
  try{ const saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"null"); if(saved) applySettings(saved); }catch(e){}
  settingsReady=true;
  draw();
});

enhanceValueBoxes();
renderTabs();
renderGradChips();
syncFrameOpts();
draw();
</script>
